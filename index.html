<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#10131c">
    <title>ICE Chat</title>
    <link rel="stylesheet" href="./style.css">
    <script src="./app.js" defer></script>
  </head>
  <body>
    <main class="chat-shell" aria-label="ICE chat">
      <header class="chat-header">
        <div class="brand-mark" aria-hidden="true">I</div>
        <div class="brand-copy">
          <h1>ICE Chat</h1>
          <p>Simple, cool conversations.</p>
        </div>
        <div class="connection" aria-live="polite">
          <span class="connection-dot" aria-hidden="true"></span>
          <span id="connection-status">On this device</span>
        </div>
      </header>

      <section class="chat-content" aria-label="Conversation">
        <div class="welcome" id="welcome">
          <div class="welcome-icon" aria-hidden="true">✦</div>
          <h2>Your chat starts here</h2>
          <p>Send a message to get the conversation going.</p>
        </div>
        <ul id="messages" class="messages" aria-live="polite" aria-relevant="additions"></ul>
      </section>

      <form id="message-form" class="composer">
        <label class="visually-hidden" for="message-input">Write a message</label>
        <input id="message-input" name="message" type="text" placeholder="Write a message…" autocomplete="off" maxlength="2000" required>
        <button type="submit" aria-label="Send message">
          <span>Send</span>
          <svg aria-hidden="true" viewBox="0 0 20 20"><path d="M3 10 17 3l-4.5 14-2.7-5.3L3 10Zm6.8 1.7L17 3" /></svg>
        </button>
      </form>
      <p class="footnote" id="storage-note">Messages are saved in this browser on this device.</p>
    </main>
  </body>
</html>
